name: Auto Commit

on:
  schedule:
    # 6:00 AM IST
    - cron: '30 0 * * *'

    # 1:00 PM IST
    - cron: '30 7 * * *'

    # 11:30 PM IST
    - cron: '0 18 * * *'

    # 1:40 AM IST (Test)
    - cron: '10 20 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update commits.txt
        run: |
          touch commits.txt
          echo "Commit at $(date)" >> commits.txt

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add commits.txt
          git commit -m "Auto Commit $(date)" || exit 0
          git push
